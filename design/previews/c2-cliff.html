<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C2 · The Cliff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">
<style>
/* C2 · THE CLIFF — in the Free Cliffs you vote by throwing it off one.
   Fold the ballot into a paper plane, throw it into a candidate's balloon, toll the bell. */
:root { --night:#1a1633; --paper:#fbf3df; --cw:30vw; --ch:44vh; }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; background:var(--night); color:var(--night); font-family:"Fraunces", Georgia, serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
.world { position:fixed; inset:0; overflow:hidden; background:linear-gradient(#1d2452 0, #4b3f80 26%, #c2607a 52%, #f39a5c 70%, #f9d58e 84%); }
.stars { position:absolute; inset:0 0 55% 0; background:radial-gradient(circle, #fff 0 1px, transparent 1.5px) 0 0 / 130px 110px, radial-gradient(circle, #fff 0 1px, transparent 1.5px) 60px 50px / 170px 150px; opacity:.6; }
.sun { position:absolute; left:58%; bottom:14%; width:min(34vw,300px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle, #fff6d8, #ffd27a 55%, #f39a5c); box-shadow:0 0 90px 30px rgba(255,210,122,.55); transform:translateX(calc(var(--px,0) * -6px)); }
.mt { position:absolute; left:-3%; width:106%; bottom:0; display:block; }
.m1 { height:42%; fill:#7a4f8e; transform:translateX(calc(var(--px,0) * -10px)); } .m2 { height:31%; fill:#553a7a; transform:translateX(calc(var(--px,0) * -20px)); } .m3 { height:19%; fill:#33275c; transform:translateX(calc(var(--px,0) * -34px)); }
.fog { position:absolute; left:0; right:0; bottom:0; height:16%; background:linear-gradient(transparent, rgba(249,213,142,.5)); }
.cloud { position:absolute; height:26px; border-radius:20px; background:rgba(255,236,214,.55); filter:blur(1px); animation:drift linear infinite; }
.cloud::before { content:""; position:absolute; left:18%; top:-12px; width:44%; height:26px; border-radius:20px; background:inherit; }
@keyframes drift { from { transform:translateX(-30vw); } to { transform:translateX(130vw); } }

/* ── balloons ── */
.sky { position:absolute; left:calc(var(--cw) - 2vw); right:3%; top:9%; bottom:15%; }
.bal { position:absolute; width:clamp(92px,13.5vw,140px); margin:0; padding:0; border:0; background:none; cursor:pointer; font:inherit; container-type:inline-size; outline-offset:6px;
  translate:-50% -50%; animation:bob var(--d,5s) ease-in-out infinite alternate, arrive 1.2s cubic-bezier(.2,.8,.2,1) both; transition:transform 1.5s cubic-bezier(.5,0,.8,.4), opacity 1s .4s; }
@keyframes bob { to { margin-top:-14px; } } @keyframes arrive { from { transform:translate(60vw,-20vh); opacity:0; } }
.bal.away { transform:translate(70vw,-46vh); opacity:0; }
.bal:focus-visible, .plane:focus-visible, .bell:focus-visible { outline:3px solid #fff; }
.env { display:grid; place-items:center; aspect-ratio:1/1.12; border-radius:50% 50% 46% 46% / 52% 52% 48% 48%; background:
  radial-gradient(circle at 32% 26%, rgba(255,255,255,.5), transparent 40%),
  repeating-linear-gradient(90deg, var(--c) 0 16.6%, color-mix(in srgb, var(--c) 72%, #fff) 16.6% 33.3%); box-shadow:inset -12px -16px 24px rgba(20,10,40,.35); transition:filter .3s; }
.disc { width:46%; aspect-ratio:1; border-radius:50%; background:var(--paper); display:grid; place-items:center; color:var(--c); margin-top:-6%; }
.disc .sym { width:64%; height:64%; }
.ropes { display:block; width:34%; height:13cqw; margin:-1px auto 0; background:linear-gradient(100deg, transparent 47%, #3a2a1c 47% 53%, transparent 53%) 0 0 / 50% 100% no-repeat, linear-gradient(80deg, transparent 47%, #3a2a1c 47% 53%, transparent 53%) 100% 0 / 50% 100% no-repeat; }
.bask { position:relative; display:block; width:26%; height:15cqw; margin:0 auto; border-radius:3px 3px 6px 6px; background:repeating-linear-gradient(90deg, #8a5a2b 0 3px, #6d4520 3px 6px); }
.bask svg { position:absolute; left:-30%; top:-74%; width:160%; opacity:0; transform:rotate(-34deg) scale(.4); transition:opacity .2s, transform .3s cubic-bezier(.3,1.5,.5,1); }
.bal.has .bask svg { opacity:1; transform:rotate(-34deg) scale(1); }
.ban { display:block; width:max-content; max-width:130%; margin:5px auto 0; position:relative; left:50%; translate:-50% 0; padding:2px 8px 3px; background:var(--paper); font-weight:800; font-size:max(11px,10.5cqw); line-height:1.1; border-radius:2px; box-shadow:0 2px 0 rgba(20,10,40,.3); }
.ban small { font-weight:600; font-size:.72em; opacity:.6; margin-left:5px; }
.bal.has .env { filter:brightness(1.12) drop-shadow(0 0 14px rgba(255,236,170,.8)); }
.bal.no { animation:bob var(--d,5s) ease-in-out infinite alternate, nope .35s; } @keyframes nope { 30% { rotate:-7deg; } 70% { rotate:7deg; } }

/* ── the cliff you stand on ── */
.cliff { position:absolute; left:0; bottom:0; width:var(--cw); height:var(--ch); display:block; }
.post { position:absolute; left:max(10px,1.6vw); bottom:calc(var(--ch) - 6px); width:min(calc(var(--cw) - 4vw), 250px); z-index:3; padding-bottom:122px; }
.post::before { content:""; position:absolute; left:16px; top:10px; bottom:-8px; width:9px; background:#2a2140; border-radius:3px; }
.sign { position:relative; margin-left:6px; padding:9px 12px 10px; background:var(--paper); border-radius:4px 14px 4px 4px; box-shadow:0 5px 0 rgba(20,10,40,.35); transform:rotate(-2deg); }
.sign small { display:block; font-size:12px; font-weight:800; letter-spacing:.14em; opacity:.6; }
.sign h2 { font-size:clamp(19px,2.6vw,27px); font-weight:800; line-height:1.02; }
.sign p { font-size:clamp(13px,1.6vw,16px); font-style:italic; font-weight:500; line-height:1.15; margin-top:3px; }
.warn { position:absolute; left:max(14px,2.4vw); bottom:calc(var(--ch) - 92px); z-index:3; padding:5px 9px; background:#f3c64a; font-size:11px; font-weight:800; letter-spacing:.08em; line-height:1.2; transform:rotate(3deg); box-shadow:0 3px 0 rgba(0,0,0,.5); }
.bell { position:absolute; left:calc(var(--cw) * .12 + 16px); bottom:calc(var(--ch) + 4px); width:58px; height:104px; border:0; background:none; padding:0; cursor:pointer; z-index:4; touch-action:none; transform-origin:50% 0; opacity:.35; transition:opacity .3s; }
.bell.ready { opacity:1; animation:sway 1.1s ease-in-out infinite alternate; } @keyframes sway { from { rotate:-9deg; } to { rotate:9deg; } }
.bell.toll { animation:toll .9s ease-in-out; } @keyframes toll { 20% { rotate:26deg; } 50% { rotate:-22deg; } 80% { rotate:12deg; } }
.edge { position:absolute; left:calc(var(--cw) * .78); bottom:calc(var(--ch) - 2px); width:0; height:0; z-index:6; }
.plane { position:absolute; left:calc(var(--i) * -54px - 40px); top:-44px; width:60px; height:46px; border:0; background:none; padding:0; cursor:grab; touch-action:none; filter:drop-shadow(0 6px 5px rgba(20,10,40,.4)); transform:rotate(-16deg); }
.plane svg { width:100%; height:100%; display:block; }
.plane.idle { animation:flutter 1.6s ease-in-out infinite alternate; } @keyframes flutter { to { translate:0 -5px; } }

/* ── the gull and the tag ── */
.gull { position:absolute; left:100%; top:30%; width:70px; z-index:7; transition:transform 2.2s cubic-bezier(.3,.6,.3,1); pointer-events:none; }
.gull path { animation:flap .28s ease-in-out infinite alternate; transform-origin:35px 20px; } @keyframes flap { to { transform:scaleY(.35); } }
.tag { position:absolute; left:50%; top:50%; width:min(330px,86vw); z-index:9; padding:24px 22px 20px 22px; text-align:center; background:var(--paper); border-radius:6px; box-shadow:0 26px 40px rgba(20,10,40,.55);
  transform:translate(-50%,-140vh) rotate(9deg); transition:transform 1s cubic-bezier(.2,.8,.2,1); }
.tag::before { content:""; position:absolute; left:50%; top:10px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--night); box-shadow:0 0 0 4px #c9a14a; }
.tag.show { transform:translate(-50%,-50%) rotate(-3deg); }
.tag .crest { width:40px; margin-top:16px; color:#c2607a; }
.tag h3 { font-size:25px; font-weight:800; line-height:1.05; margin:6px 0; }
.tag code { display:block; font:800 21px "Fraunces", serif; letter-spacing:.08em; margin:10px 0; padding:10px 0; border-block:2px dashed var(--night); }
.tag p { font-style:italic; font-weight:500; font-size:16px; line-height:1.2; }

@media (orientation:portrait) {
  :root { --cw:66vw; --ch:22vh; }
  .sky { left:4%; right:4%; top:12%; bottom:calc(var(--ch) + 22vh); } .bal { width:clamp(86px,25vw,120px); }
  .post { width:min(52vw,210px); } .sun { left:44%; bottom:20%; width:60vw; }
}
@media (prefers-reduced-motion:reduce) { * { animation-duration:.01s !important; transition-duration:.01s !important; } }
</style>
</head>
<body>
<main class="world" id="world">
  <div class="stars"></div><div class="sun"></div>
  <i class="cloud" style="top:12%;width:150px;animation-duration:70s;animation-delay:-20s"></i><i class="cloud" style="top:27%;width:110px;animation-duration:95s;animation-delay:-60s"></i><i class="cloud" style="top:41%;width:190px;animation-duration:120s;animation-delay:-90s"></i>
  <svg class="mt m1" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 300V190l80-80 70 60 130-130 90 100 100-130 140 140 90-70 130 100 170-120V300z"/></svg>
  <svg class="mt m2" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 300V170l120 70 100-110 110 90 140-150 110 120 120-80 130 110 170-60V300z"/></svg>
  <svg class="mt m3" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 300V210l160-90 120 100 150-60 130 90 170-130 140 110 130-50V300z"/></svg>
  <div class="fog"></div>
  <div class="sky" id="sky"></div>
  <svg class="cliff" viewBox="0 0 300 500" preserveAspectRatio="none"><path d="M0 6h262l22 10-14 34 16 44-26 62 12 84-34 92 10 168H0z" fill="#1a1633"/><path d="M0 6h262l22 10" stroke="#5fae6a" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M40 6l-4-14M90 6l3-16M150 6l-3-13M210 6l4-15M246 7l6-12" stroke="#5fae6a" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="post"><div class="sign" id="sign" role="status"></div></div>
  <div class="warn">MIND THE EDGE.<br>THE EDGE DOES NOT MIND YOU.</div>
  <button class="bell" id="bell" aria-label="Toll the bell to send this throw"><svg viewBox="0 0 58 104"><path d="M29 0v22" stroke="#2a2140" stroke-width="4"/><path d="M29 20c-13 0-19 10-19 26 0 14-4 20-8 24h54c-4-4-8-10-8-24 0-16-6-26-19-26z" fill="#e2b34a"/><path d="M18 30c2-5 6-7 11-7" stroke="#fff3c4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="29" cy="76" r="6" fill="#8e6a22"/><path d="M29 82v16" stroke="#8e6a22" stroke-width="3"/><circle cx="29" cy="99" r="4" fill="#c2607a"/></svg></button>
  <div class="edge" id="edge"></div>
  <svg class="gull" id="gull" viewBox="0 0 70 40"><path d="M2 14c10-10 22-8 33 6 11-14 23-16 33-6-12-4-22 0-33 14C24 14 14 10 2 14z" fill="#fbf3df"/></svg>
  <div class="tag" id="tag" role="status"></div>
</main>

<script src="shared.js"></script>
<script>
const { $, $$, wait, election: E, sym, crest, sfx, drag, centre, code, chrome, rnd } = EP;
chrome({ code: "C2", name: "The Cliff" });

const world = $("#world"), sky = $("#sky"), edge = $("#edge"), sign = $("#sign"), bell = $("#bell");
const POS = { 4: [[15, 30], [39, 64], [62, 26], [86, 60]], 2: [[30, 38], [72, 52]] };
const POSP = { 4: [[26, 22], [74, 34], [28, 66], [76, 80]], 2: [[28, 34], [72, 62]] };
const PLANE = `<svg viewBox="0 0 60 46"><path d="M2 20L58 2 40 44 28 30z" fill="#fbf3df"/><path d="M2 20l26 10 30-28z" fill="#e9dcbd"/><path d="M28 30l2 14 8-6z" fill="#cdbf9c"/></svg>`;
const sel = {}; let idx = 0, busy = false, planes = [];

addEventListener("pointermove", (e) => world.style.setProperty("--px", (e.clientX / innerWidth - 0.5).toFixed(3)));

function scene() {
  const p = E.points[idx], portrait = matchMedia("(orientation:portrait)").matches, pos = (portrait ? POSP : POS)[p.options.length];
  sel[p.id] = [];
  sign.innerHTML = `<small>THROW ${p.no} OF 3</small><h2>${p.title}</h2><p>${p.kind === "yesno" ? p.ask : p.max > 1 ? "Two planes, two balloons." : "One plane. Choose its balloon."}</p>`;
  sky.innerHTML = p.options.map((o, i) => `<button class="bal" data-id="${o.id}" aria-label="${o.full}" style="--c:${o.color};left:${pos[i][0]}%;top:${pos[i][1]}%;--d:${rnd(3.5, 6).toFixed(1)}s;animation-delay:0s,${i * 0.15}s">
    <span class="env"><span class="disc">${sym(o.sym)}</span></span><span class="ropes"></span><span class="bask">${PLANE}</span><b class="ban">${o.name}${o.party ? `<small>${o.party}</small>` : ""}</b></button>`).join("");
  edge.innerHTML = ""; planes = [];
  for (let i = 0; i < p.max; i++) {
    const el = document.createElement("button"); el.className = "plane idle"; el.style.setProperty("--i", i); el.innerHTML = PLANE; el.setAttribute("aria-label", `Paper plane ${i + 1}`);
    edge.append(el); const pl = { el, at: null, x: 0, y: 0 }; planes.push(pl);
    drag(el, {
      when: () => !busy && !pl.at,
      start: () => el.classList.remove("idle"),
      move: (dx, dy) => { el.style.transform = `translate(${dx}px,${dy}px) rotate(${-16 + dx / 30}deg)`; pl.x = dx; pl.y = dy; },
      end: (dx, dy, e, moved) => {
        if (!moved) { home(pl); return; }
        const best = $$(".bal", sky).map((b) => { const c = centre(b); return { b, d: Math.hypot(c.x - e.clientX, c.y - e.clientY) }; }).sort((a, b) => a.d - b.d)[0];
        if (best && best.d < Math.max(110, innerWidth * 0.14)) throwAt(pl, best.b); else home(pl);
      },
    });
  }
  $$(".bal", sky).forEach((b) => (b.onclick = () => tap(b)));
  ready();
}
const ready = () => bell.classList.toggle("ready", (sel[E.points[idx].id] || []).length > 0);
const basket = (b) => centre($(".bask", b));

/* a plane follows an arc: start, a high control point, the basket */
function arc(pl, to, shrink, ms = 900) {
  const r = pl.el.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2, bx = pl.x, by = pl.y;
  const cx = (x0 + to.x) / 2, cy = Math.min(y0, to.y) - Math.max(120, Math.abs(to.x - x0) * 0.3), t0 = performance.now();
  return new Promise((res) => (function step(now) {
    const t = Math.min(1, (now - t0) / ms), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, u = 1 - e;
    const x = u * u * x0 + 2 * u * e * cx + e * e * to.x, y = u * u * y0 + 2 * u * e * cy + e * e * to.y;
    const ang = Math.atan2(2 * u * (cy - y0) + 2 * e * (to.y - cy), 2 * u * (cx - x0) + 2 * e * (to.x - cx)) * 180 / Math.PI;
    pl.x = bx + x - x0; pl.y = by + y - y0;
    pl.el.style.transform = `translate(${pl.x}px,${pl.y}px) rotate(${ang - 16}deg) scale(${shrink === "in" ? 1 - 0.65 * e : shrink === "out" ? 0.35 + 0.65 * e : 1})`;
    t < 1 ? requestAnimationFrame(step) : res();
  })(t0));
}
async function home(pl) {
  busy = true; pl.el.style.visibility = "visible";
  const a = edge.getBoundingClientRect(), i = planes.indexOf(pl);
  await arc(pl, { x: a.left - i * 54 - 10, y: a.top - 21 }, pl.at ? "out" : null, 700);
  pl.x = pl.y = 0; pl.at = null; pl.el.style.transform = ""; pl.el.classList.add("idle"); busy = false;
}
async function throwAt(pl, b) {
  const p = E.points[idx], id = b.dataset.id;
  if (sel[p.id].includes(id)) { nope(b); return home(pl); }      /* one plane per balloon */
  busy = true; pl.el.classList.remove("idle"); sfx.whoosh();
  await arc(pl, basket(b), "in");
  pl.at = id; sel[p.id].push(id); pl.el.style.visibility = "hidden"; b.classList.add("has"); sfx.pop(); sfx.hiss();
  busy = false; ready();
}
async function takeBack(b) {
  const p = E.points[idx], pl = planes.find((q) => q.at === b.dataset.id); if (!pl) return;
  sel[p.id] = sel[p.id].filter((x) => x !== b.dataset.id); b.classList.remove("has"); sfx.paper(); ready();
  await home(pl);
}
const nope = (b) => { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); sfx.buzz(); };
async function tap(b) {
  if (busy) return;
  const p = E.points[idx];
  if (b.classList.contains("has")) return takeBack(b);
  let pl = planes.find((q) => !q.at);
  if (!pl) {
    if (p.max > 1) return nope(b);
    const old = $(".bal.has", sky); await takeBack(old); pl = planes[0];   /* a single plane changes balloons */
  }
  throwAt(pl, b);
}

/* ── the bell sends the throw on its way ── */
async function toll() {
  if (busy || !bell.classList.contains("ready")) return; busy = true;
  bell.classList.remove("ready"); bell.classList.add("toll"); sfx.bell(); setTimeout(() => sfx.bell(), 450);
  await wait(700); sfx.whoosh(); $$(".bal", sky).forEach((b, i) => setTimeout(() => b.classList.add("away"), i * 120));
  await wait(1700); bell.classList.remove("toll"); idx++; busy = false;
  if (idx < E.points.length) scene(); else finale();
}
bell.onclick = toll;
drag(bell, { when: () => !busy && bell.classList.contains("ready"), end: (dx, dy, e, moved) => { if (moved && dy > 14) toll(); } });

async function finale() {
  sky.innerHTML = ""; edge.innerHTML = "";
  sign.innerHTML = `<small>ALL THROWN</small><h2>The wind has it now.</h2><p>A gull is bringing your receipt.</p>`;
  const g = $("#gull"), s = sign.getBoundingClientRect(), r = g.getBoundingClientRect();
  g.style.transform = `translate(${s.right - 40 - r.left}px,${s.top - 34 - r.top}px)`; sfx.tone(1900, 0.25, { to: 1300, vol: 0.06 }); setTimeout(() => sfx.tone(2000, 0.3, { to: 1250, vol: 0.06 }), 500);
  await wait(2300); $$("path", g).forEach((p) => (p.style.animation = "none"));
  const t = $("#tag");
  t.innerHTML = `${crest()}<h3>Carried off the Cliff</h3><code>${code()}</code><p>Three throws, counted where they land.<br>Keep this number. The gulls already know it.</p>`;
  t.classList.add("show"); sfx.paper(); sfx.ding();
}

scene();
</script>
</body>
</html>
