<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 · The Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* A1 · THE BOOTH — a wooden polling booth behind a green curtain.
   Pencil on a string, three tinted ballot papers, a sealed steel box. */
:root { --ink:#23201c; --brass:#c9a14a; --felt:#1e3a2b; --pw:min(440px,92vw); }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; background:#140d07; color:var(--ink);
  font-family:"Libre Caslon Text", Georgia, serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
.cond { font-family:"IBM Plex Sans Condensed", "Arial Narrow", sans-serif; }
.stage { position:fixed; inset:0; overflow:hidden; }

/* ── booth ── */
.booth { position:absolute; inset:0; background:
  radial-gradient(110% 60% at 50% -8%, rgba(255,216,150,.6), transparent 62%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, transparent 2px 128px),
  repeating-linear-gradient(91deg, rgba(255,255,255,.035) 0 1px, transparent 1px 7px),
  linear-gradient(#6d4a2b, #4b311a); }
.notice { position:absolute; left:50%; top:max(52px, 7%); transform:translateX(-50%); display:flex; align-items:center; gap:14px;
  padding:9px 18px; color:#3d2c0b; background:linear-gradient(#e2c06f, #b98f3b); border-radius:3px;
  box-shadow:0 1px 0 #f3dc9c inset, 0 4px 10px rgba(0,0,0,.45); }
.notice::before, .notice::after { content:""; width:6px; height:6px; border-radius:50%; background:#6b4a14; box-shadow:0 1px 0 #f1d894; }
.notice svg { width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.notice i { width:14px; height:2px; background:currentColor; opacity:.5; }
.notice svg.done { opacity:.35; }
.notice svg.now { animation:nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform:translateY(-3px); } }
.shelf { position:absolute; left:0; right:0; bottom:0; top:22%; border-top:12px solid #36220f; display:grid; place-items:center;
  box-shadow:inset 0 22px 26px -12px rgba(0,0,0,.6); background:
  radial-gradient(90% 80% at 50% 0%, rgba(255,226,170,.42), transparent 70%),
  repeating-linear-gradient(2deg, rgba(60,30,0,.07) 0 2px, transparent 2px 9px),
  repeating-linear-gradient(-1deg, rgba(255,240,210,.05) 0 1px, transparent 1px 13px),
  linear-gradient(#b48a57, #96703f); }
.mote { position:absolute; width:3px; height:3px; border-radius:50%; background:rgba(255,236,190,.55); animation:drift linear infinite; pointer-events:none; }
@keyframes drift { from { transform:translate(0,0); opacity:0; } 15% { opacity:1; } to { transform:translate(40px,-34vh); opacity:0; } }

.pile, .tray { position:absolute; width:96px; height:70px; }
.pile { left:max(5%, calc(50% - var(--pw) / 2 - 150px)); top:50%; }
.tray { right:max(5%, calc(50% - var(--pw) / 2 - 150px)); top:50%; }
.pile i, .slip { position:absolute; inset:0; background:var(--tint); box-shadow:0 2px 5px rgba(30,15,0,.45); }
.pile i { transition:transform .5s, opacity .4s; }
.slip { background:linear-gradient(var(--tint), var(--tint)) padding-box; border-bottom:10px solid rgba(35,32,28,.22); animation:land .3s ease-out both; }
@keyframes land { from { transform:translateY(-10px) rotate(var(--r)); opacity:0; } to { transform:rotate(var(--r)); } }

/* ── ballot paper ── */
.sheet { position:relative; width:var(--pw); transform:rotate(-1.2deg); filter:drop-shadow(0 14px 12px rgba(25,12,0,.45)); animation:deal .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes deal { from { transform:translate(-80vw,-8vh) rotate(-18deg); } }
.f3d { position:relative; perspective:1500px; }
.paper { position:relative; padding:16px 18px 12px; background:var(--tint); background-image:
  repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.01) 0 1px, transparent 1px 4px);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 0px),calc(100% - 0px) 100%,0 100%); transition:clip-path .25s; }
.paper.ready { clip-path:polygon(0 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%); }
@media (hover:hover) { .paper { cursor:none; } }
.paper header { display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; padding-bottom:12px; border-bottom:3px double var(--ink); }
.paper .crest { width:40px; }
.paper header small { display:block; font:600 10.5px "IBM Plex Sans Condensed", sans-serif; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
.paper h2 { font-size:25px; font-weight:700; line-height:1.1; margin:2px 0; }
.paper em { font-size:14px; opacity:.8; }
.paper header b { font-size:30px; font-weight:400; align-self:start; line-height:1; }
.paper header b i { font-size:14px; font-style:normal; opacity:.55; }
.paper ul { list-style:none; padding:0; margin:0; }
.paper li { display:grid; grid-template-columns:38px 1fr 50px; gap:12px; align-items:center; height:64px; border-bottom:1px solid rgba(35,32,28,.5); }
.paper .sy svg { width:34px; height:34px; display:block; }
.paper .nm { font-size:19px; line-height:1.1; }
.paper .nm small { display:block; margin-top:3px; font:600 11px "IBM Plex Sans Condensed", sans-serif; letter-spacing:.14em; opacity:.62; }
.box { position:relative; width:48px; height:48px; border:2.5px solid var(--ink); background:rgba(255,255,255,.4); outline-offset:4px; }
.box:focus-visible { outline:3px solid #2456a6; }
.box canvas { position:absolute; inset:-9px; width:calc(100% + 18px); height:calc(100% + 18px); transition:opacity .25s; }
.box canvas.rub { opacity:0; }
.paper footer { display:flex; justify-content:space-between; padding:12px 44px 8px 0; font:500 10.5px "IBM Plex Mono", monospace; letter-spacing:.08em; opacity:.55; }
.fold { position:absolute; right:0; bottom:0; width:46px; height:46px; border:0; padding:0 0 0 0; cursor:pointer; color:var(--ink);
  background:linear-gradient(135deg, color-mix(in srgb, var(--tint) 86%, #000) 0 50%, transparent 50%); clip-path:polygon(0 0,100% 0,0 100%);
  transform-origin:100% 100%; transform:scale(0); transition:transform .25s; }
.paper.ready .fold { transform:scale(1); }
.fold svg { position:absolute; left:5px; top:5px; width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; animation:nudge 1.2s ease-in-out infinite; }
.paper.shake { animation:shake .3s; }
@keyframes shake { 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
.flap { position:absolute; inset:0; transform-style:preserve-3d; animation:foldup .6s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes foldup { to { transform:rotateX(180deg); } }
.flap > * { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.flap .paper { clip-path:inset(50% 0 0 0); transition:none; }
.back { background:var(--tint); clip-path:inset(0 0 50% 0); transform:rotateX(180deg); background-image:
  repeating-radial-gradient(circle at 50% 25%, rgba(35,32,28,.07) 0 1px, transparent 1px 9px); border-top:10px solid rgba(35,32,28,.22); }

/* ── pencil on its string ── */
#string { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
#string path { fill:none; stroke:#d9cfb8; stroke-width:1.4; }
.pencil { position:fixed; left:0; top:0; width:13px; height:150px; margin:-150px 0 0 -6.5px; transform-origin:50% 100%; pointer-events:none; z-index:6;
  background:linear-gradient(90deg, #c98a12, #f0bb35 45%, #b87c0c); border-radius:3px 3px 0 0;
  clip-path:polygon(0 0,100% 0,100% 86%,50% 100%,0 86%); filter:drop-shadow(3px 5px 3px rgba(0,0,0,.35)); }
.pencil::before { content:""; position:absolute; inset:0 0 auto 0; height:16px; background:linear-gradient(#d9837c 0 62%, #b9b9b9 62%); }
.pencil::after { content:""; position:absolute; inset:auto 0 0 0; height:21px; background:linear-gradient(#e9cfa0 0 62%, #2b2b2b 62%); }

/* ── hall with the box ── */
.hall { position:absolute; inset:0; visibility:hidden; background:
  radial-gradient(80% 55% at 50% 30%, rgba(255,235,200,.5), transparent 70%),
  linear-gradient(#d8cdb8 0 62%, #5e4a36 62% 63%, #7c6248 63%); }
.hall .big { position:absolute; left:50%; top:9%; width:min(120px,22vw); transform:translateX(-50%); color:#8d7c5f; opacity:.5; }
.urn { position:absolute; left:50%; top:58%; width:min(360px,72vw); transform:translate(-50%,-50%); }
.urn.jolt { animation:jolt .25s; }
@keyframes jolt { 40% { transform:translate(-50%,calc(-50% + 5px)); } }
.urn .top { height:56px; background:linear-gradient(#3a5a47, #24402f); clip-path:polygon(9% 0,91% 0,100% 100%,0 100%); position:relative; }
.slot { position:absolute; left:20%; right:20%; top:44%; height:10px; border-radius:5px; background:#06100a; box-shadow:0 1px 0 rgba(255,255,255,.18); }
.urn .front { position:relative; height:min(210px,26vh); background:
  radial-gradient(circle at 12px 12px, #5f806c 0 3px, transparent 4px), radial-gradient(circle at calc(100% - 12px) 12px, #5f806c 0 3px, transparent 4px), radial-gradient(circle at 12px calc(100% - 12px), #5f806c 0 3px, transparent 4px), radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #5f806c 0 3px, transparent 4px),
  linear-gradient(#1f3b2b, #162c20); box-shadow:0 30px 30px -14px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.14);
  display:grid; place-items:center; color:var(--brass); }
.urn .front .crest { width:74px; }
.tape { position:absolute; left:50%; top:-16px; width:44px; height:64px; margin-left:-22px; background:#efe6cf; box-shadow:0 1px 3px rgba(0,0,0,.4); }
.wax { position:absolute; left:50%; top:4px; width:42px; height:42px; margin-left:-21px; border-radius:46% 54% 50% 50%; color:#5e0f0c;
  background:radial-gradient(circle at 35% 30%, #d2463c, #8e1a14 70%); box-shadow:0 2px 4px rgba(0,0,0,.5); display:grid; place-items:center; }
.wax .crest { width:22px !important; }
.wax.glint { animation:glint 1s ease-out; }
@keyframes glint { 30% { filter:brightness(1.8); transform:scale(1.12); } }
.chute { position:fixed; overflow:hidden; pointer-events:none; z-index:3; }
.hand { position:absolute; left:50%; bottom:max(40px, 7%); width:0; height:0; z-index:4; }
.hslip { position:absolute; left:-55px; top:-74px; width:110px; height:74px; background:var(--tint); border-bottom:11px solid rgba(35,32,28,.22); cursor:grab;
  box-shadow:0 6px 10px rgba(0,0,0,.4); transform:translate(calc(var(--x) + var(--dx,0px)), var(--dy,0px)) rotate(var(--r)); outline-offset:4px; }
.hslip.go { transition:transform .35s cubic-bezier(.3,.7,.3,1); }
.hslip.in { position:absolute; cursor:default; box-shadow:none; transform:none; transition:transform .45s cubic-bezier(.6,0,.9,.6); }
.hslip:focus-visible { outline:3px solid #2456a6; }
.hint { position:absolute; left:50%; bottom:calc(max(40px, 7%) + 96px); width:26px; height:40px; margin-left:-13px; color:#3d2f20; opacity:.7; animation:rise 1.4s ease-in-out infinite; pointer-events:none; }
@keyframes rise { 50% { transform:translateY(-12px); opacity:.25; } }

/* ── receipt ── */
.receipt { position:absolute; left:50%; top:50%; width:min(320px,84vw); padding:26px 22px 22px; text-align:center; background:#f6f1e4; z-index:8;
  transform:translate(-50%,120vh) rotate(4deg); transition:transform .8s cubic-bezier(.2,.8,.2,1); box-shadow:0 24px 40px rgba(0,0,0,.5);
  -webkit-mask:radial-gradient(circle at 7px 0, transparent 5px, #000 5.5px) -7px 0 / 14px 100%; mask:radial-gradient(circle at 7px 0, transparent 5px, #000 5.5px) -7px 0 / 14px 100%; }
.receipt.show { transform:translate(-50%,-50%) rotate(-2deg); }
.receipt .crest { width:44px; }
.receipt .ok { display:block; width:64px; margin:10px auto 6px; fill:none; stroke:#2f6b3a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:80; stroke-dashoffset:80; }
.receipt.show .ok { animation:draw .5s .7s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }
.receipt code { display:block; font:500 21px "IBM Plex Mono", monospace; letter-spacing:.06em; padding:12px 0; border-block:1px dashed rgba(35,32,28,.5); margin:8px 0 10px; }
.receipt small { font:600 10.5px "IBM Plex Sans Condensed", sans-serif; letter-spacing:.16em; text-transform:uppercase; opacity:.65; }
.stamp { position:absolute; right:10px; top:14px; padding:5px 10px 3px; border:3px solid #a8261e; color:#a8261e; border-radius:4px; opacity:0;
  font:600 20px "IBM Plex Sans Condensed", sans-serif; letter-spacing:.14em; transform:rotate(11deg) scale(2.6); mix-blend-mode:multiply; }
.stamp small { display:block; font-size:9px; opacity:1; letter-spacing:.2em; }
.receipt.show .stamp { animation:slam .22s 1.4s cubic-bezier(.6,0,1,.4) forwards; }
@keyframes slam { to { opacity:.85; transform:rotate(11deg) scale(1); } }

/* ── curtain ── */
.curtain { position:absolute; top:0; bottom:0; width:51%; z-index:20; transition:transform 1.15s cubic-bezier(.7,0,.25,1); background:
  linear-gradient(rgba(0,0,0,.5), transparent 16%),
  repeating-linear-gradient(90deg, #142a1c 0, #2d5a3e 22px, #1b3826 46px, #12261a 70px); box-shadow:0 0 40px rgba(0,0,0,.6); }
.curtain.l { left:0; } .curtain.r { right:0; }
.open .curtain.l { transform:translateX(-93%) skewX(1.5deg); } .open .curtain.r { transform:translateX(93%) skewX(-1.5deg); }
.rail { position:absolute; left:0; right:0; top:0; height:14px; z-index:21; background:linear-gradient(#e2c06f, #8d6a25); box-shadow:0 3px 8px rgba(0,0,0,.5); }
.plate { position:absolute; left:50%; top:50%; z-index:22; transform:translate(-50%,-50%); width:min(230px,60vw); aspect-ratio:1/1.18; border:0; cursor:pointer;
  border-radius:50%; color:#3d2c0b; background:radial-gradient(circle at 35% 25%, #f0d58c, #b98f3b 70%); display:grid; place-items:center; align-content:center; gap:8px;
  box-shadow:0 0 0 6px #8d6a25, 0 0 0 8px #e8cb7c, 0 18px 34px rgba(0,0,0,.55); transition:opacity .4s, transform .5s; font:inherit; }
.plate .crest { width:44%; }
.plate small { font:600 11px "IBM Plex Sans Condensed", sans-serif; letter-spacing:.24em; text-transform:uppercase; }
.plate span { font-size:22px; letter-spacing:.4em; animation:part 1.4s ease-in-out infinite; }
@keyframes part { 50% { letter-spacing:.9em; } }
.open .plate { opacity:0; transform:translate(-50%,-50%) scale(.8); pointer-events:none; }
.plate:focus-visible { outline:3px solid #fff; outline-offset:12px; }

@media (max-width:760px) {
  .pile, .tray { top:auto; bottom:4%; width:78px; height:56px; }
  .pile { left:7%; } .tray { right:7%; }
  .shelf { place-items:start center; padding-top:22px; top:19%; }
  .paper li { height:58px; } .notice { top:50px; padding:7px 14px; gap:10px; } .notice svg { width:24px; height:24px; }
}
@media (max-height:700px) { .paper li { height:52px; } .box { width:42px; height:42px; } .shelf { top:17%; } }
@media (prefers-reduced-motion:reduce) { * { animation-duration:.01s !important; transition-duration:.01s !important; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="booth" id="booth">
    <div class="notice" id="notice" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="now"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg><i></i>
      <svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM5 12h14"/><path d="M12 19.5v-5m-2.2 2.2L12 14.5l2.2 2.2"/></svg><i></i>
      <svg viewBox="0 0 24 24"><path d="M3 11h18v10H3zM8 11V9h8v2"/><path d="M12 1.5v6m-2.2-2.2L12 7.5l2.2-2.2"/></svg>
    </div>
    <div class="shelf" id="shelf">
      <div class="pile" id="pile"></div>
      <div id="spot"></div>
      <div class="tray" id="tray"></div>
    </div>
  </section>

  <section class="hall" id="hall">
    <div class="big" id="big"></div>
    <div class="urn" id="urn">
      <div class="top"><div class="slot" id="slot"></div></div>
      <div class="front"><div class="tape"></div><div class="wax" id="wax"></div><span id="plateCrest"></span></div>
    </div>
    <div class="chute" id="chute"></div>
    <svg class="hint" id="hint" viewBox="0 0 26 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 38V4M3 14L13 4l10 10"/></svg>
    <div class="hand" id="hand"></div>
    <div class="receipt" id="receipt" role="status"></div>
  </section>

  <svg id="string"><path/></svg>
  <div class="pencil" id="pencil"></div>
  <div class="curtain l"></div><div class="curtain r"></div><div class="rail"></div>
  <button class="plate" id="enter" aria-label="Enter the polling booth"></button>
</main>

<script src="shared.js"></script>
<script>
const { $, $$, wait, election: E, sym, crest, sfx, drag, over, centre, ink, cloneDrawn, choose, code, chrome, rnd } = EP;
chrome({ code: "A1", name: "The Booth" });

const stage = $("#stage"), spot = $("#spot"), pile = $("#pile"), tray = $("#tray"), shelf = $("#shelf");
const TINT = ["#f6f1e4", "#f3e7b5", "#dbe6ee"];
const sel = {};
let idx = 0, busy = true, phase = "door";

$("#enter").innerHTML = `${crest()}<small>Polling station</small><span>‹ ›</span>`;
$("#big").innerHTML = crest(); $("#plateCrest").innerHTML = crest(); $("#wax").innerHTML = crest();
TINT.slice().reverse().forEach((t, i) => { const s = document.createElement("i"); s.style.cssText = `--tint:${t};transform:translate(${i * 3}px,${-i * 3}px) rotate(${i * 2 - 3}deg)`; pile.append(s); });
for (let i = 0; i < 14; i++) { const m = document.createElement("i"); m.className = "mote"; m.style.cssText = `left:${rnd(20, 80)}%;top:${rnd(30, 95)}%;animation-duration:${rnd(9, 18)}s;animation-delay:${-rnd(0, 18)}s`; $("#booth").append(m); }

/* ── the pencil follows the hand, and hangs from its string otherwise ── */
const pencil = $("#pencil"), strPath = $("#string path"), LEN = 150;
const rest = () => { const r = shelf.getBoundingClientRect(), small = innerWidth < 760; return { x: innerWidth - Math.max(30, innerWidth * 0.06) - (small ? 90 : 0), y: small ? innerHeight - 30 : r.top + Math.min(250, r.height * 0.45), a: small ? 38 : 5 }; };
let pen = rest(), aim = rest();
(function swing() {
  pen.x += (aim.x - pen.x) * 0.3; pen.y += (aim.y - pen.y) * 0.3; pen.a += (aim.a - pen.a) * 0.2;
  pencil.style.transform = `translate(${pen.x}px,${pen.y}px) rotate(${pen.a}deg)`;
  const t = pen.a * Math.PI / 180, tx = pen.x + LEN * Math.sin(t), ty = pen.y - LEN * Math.cos(t);
  const ax = innerWidth - 26, ay = shelf.getBoundingClientRect().top - 4;
  strPath.setAttribute("d", `M${ax} ${ay} Q${(ax + tx) / 2} ${Math.max(ay, ty) + 46} ${tx} ${ty}`);
  requestAnimationFrame(swing);
})();
spot.addEventListener("pointermove", (e) => { if (phase === "booth") aim = { x: e.clientX, y: e.clientY, a: 30 }; });
spot.addEventListener("pointerleave", () => (aim = rest()));
spot.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") aim = rest(); });
addEventListener("resize", () => (aim = rest()));

/* ── entering ── */
$("#enter").onclick = async () => {
  sfx.paper(); stage.classList.add("open"); phase = "booth";
  await wait(650); deal();
};

function step(n) { $$("#notice svg").forEach((s, i) => { s.classList.toggle("done", i < n); s.classList.toggle("now", i === n); }); }

/* ── a ballot paper ── */
function deal() {
  const p = E.points[idx];
  pile.lastElementChild?.remove();
  const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.style.setProperty("--tint", TINT[idx]);
  sheet.innerHTML = `<div class="f3d"><article class="paper" aria-label="${p.title}">
    <header>${crest()}<div><small>${E.short} · ${E.name}</small><h2>${p.title}</h2><em>${p.ask}</em></div><b>${p.no}<i>/3</i></b></header>
    <ul>${p.options.map((o) => `<li data-id="${o.id}"><span class="sy" style="color:${o.color}">${sym(o.sym)}</span>
      <span class="nm">${o.full}${o.party ? `<small>${o.party}</small>` : ""}</span>
      <span class="box" role="checkbox" aria-checked="false" aria-label="${o.full}" tabindex="0"><canvas></canvas></span></li>`).join("")}</ul>
    <footer><span>No. ${String(41270 + idx * 7 + 3)}</span><span>${E.date}</span></footer>
    <button class="fold" aria-label="Fold this ballot" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M19 19L6 6M6 15V6h9"/></svg></button>
  </article></div>`;
  spot.append(sheet); sfx.paper(); step(0);
  const paper = $(".paper", sheet);
  const pads = new Map();
  const ready = () => { const on = (sel[p.id] || []).length > 0; paper.classList.toggle("ready", on); $(".fold", paper).tabIndex = on ? 0 : -1; step(on ? 1 : 0); };
  const rub = (li) => { const c = $("canvas", li); c.classList.add("rub"); li.classList.remove("on"); $(".box", li).setAttribute("aria-checked", "false"); setTimeout(() => { pads.get(li.dataset.id).clear(); c.classList.remove("rub"); }, 260); };
  async function mark(li, byHand) {
    if (busy) return;
    const id = li.dataset.id, pad = pads.get(id), was = (sel[p.id] || []).includes(id);
    if (was) { if (byHand) return; choose(sel, p, id); rub(li); sfx.paper(); ready(); return; }
    const r = choose(sel, p, id);
    if (r.full) { pad.clear(); paper.classList.remove("shake"); void paper.offsetWidth; paper.classList.add("shake"); sfx.buzz(); return; }
    r.off.forEach((o) => rub($(`li[data-id="${o}"]`, paper)));
    if (!byHand) { busy = true; pad.clear(); await pad.auto("x"); busy = false; }
    li.classList.add("on"); $(".box", li).setAttribute("aria-checked", "true"); ready();
  }
  $$("li", paper).forEach((li) => {
    const pad = ink($("canvas", li), { color: "#2c2c30", width: 3.4, alpha: 0.85, when: () => !busy, done: (drew) => mark(li, drew > 26) });
    pads.set(li.dataset.id, pad);
    $(".box", li).addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); mark(li, false); } });
  });
  const fb = $(".fold", paper);
  drag(fb, { when: () => !busy && paper.classList.contains("ready"), end: (dx, dy, e, moved) => { if (!moved || dy < -16 || dx < -16) fold(sheet, paper); } });
  fb.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !busy && paper.classList.contains("ready")) { e.preventDefault(); fold(sheet, paper); } });
  setTimeout(() => (busy = false), 600);
}

async function fold(sheet, paper) {
  busy = true; aim = rest(); paper.classList.remove("ready"); await wait(240);
  sfx.paper();
  const flap = document.createElement("div"); flap.className = "flap";
  const front = cloneDrawn(paper); front.querySelector(".fold")?.remove();
  const back = document.createElement("div"); back.className = "back";
  flap.append(front, back); paper.parentNode.append(flap);
  paper.style.transition = "none"; paper.style.clipPath = "inset(0 0 50% 0)";
  await wait(640); sfx.tick();
  /* the folded slip flies to the tray */
  const a = sheet.getBoundingClientRect(), b = tray.getBoundingClientRect();
  sheet.style.animation = "none"; sheet.style.transformOrigin = "50% 25%";
  sheet.style.transition = "transform .5s cubic-bezier(.5,0,.3,1), opacity .15s .4s";
  sheet.style.transform = `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px,${b.top + b.height / 2 - (a.top + a.height * 0.25)}px) scale(${b.width / a.width}) rotate(6deg)`;
  sheet.style.opacity = "0";
  await wait(480); sheet.remove();
  const slip = document.createElement("div"); slip.className = "slip"; slip.style.cssText = `--tint:${TINT[idx]};--r:${idx * 5 - 4}deg;top:${-idx * 5}px;left:${idx * 4}px`;
  tray.append(slip); sfx.tick();
  idx++;
  if (idx < E.points.length) { await wait(250); deal(); } else { await wait(500); toHall(); }
}

/* ── out of the booth, to the box ── */
async function toHall() {
  phase = "hall"; step(2); stage.classList.remove("open"); sfx.paper(); await wait(1150);
  $("#booth").style.visibility = "hidden"; pencil.style.display = "none"; $("#string").style.display = "none";
  const hall = $("#hall"), hand = $("#hand"), slot = $("#slot"), chute = $("#chute"), urn = $("#urn");
  hall.style.visibility = "visible";
  let left = 3;
  TINT.forEach((t, i) => {
    const s = document.createElement("div"); s.className = "hslip"; s.tabIndex = 0; s.setAttribute("role", "button"); s.setAttribute("aria-label", `Drop ballot ${i + 1} into the box`);
    s.style.cssText = `--tint:${t};--x:${(i - 1) * 74}px;--r:${(i - 1) * 13}deg`;
    hand.append(s);
    const cast = async () => {
      if (s.dataset.gone) return; s.dataset.gone = 1;
      const c = centre(slot), r = s.getBoundingClientRect();
      s.classList.add("go"); s.style.setProperty("--r", "0deg");
      const dx = parseFloat(s.style.getPropertyValue("--dx") || 0), dy = parseFloat(s.style.getPropertyValue("--dy") || 0);
      s.style.setProperty("--dx", dx + c.x - (r.left + r.width / 2) + "px");
      s.style.setProperty("--dy", dy + (c.y - 40) - (r.top + r.height / 2) + "px");
      await wait(370);
      Object.assign(chute.style, { left: c.x - 80 + "px", width: "160px", top: c.y - 160 + "px", height: "160px" });
      s.className = "hslip in"; s.style.left = "25px"; s.style.top = 160 - 77 + "px"; chute.append(s); sfx.paper();
      requestAnimationFrame(() => requestAnimationFrame(() => (s.style.transform = "translateY(90px)")));
      await wait(430); sfx.thud(); urn.classList.remove("jolt"); void urn.offsetWidth; urn.classList.add("jolt"); s.remove();
      if (--left === 0) finish();
    };
    drag(s, {
      when: () => !s.dataset.gone,
      start: () => { s.classList.remove("go"); $("#hint").style.display = "none"; },
      move: (dx, dy) => { s.style.setProperty("--dx", dx + "px"); s.style.setProperty("--dy", dy + "px"); },
      end: (dx, dy, e, moved) => {
        if (!moved || over(urn, e.clientX, e.clientY, 30)) return cast();
        s.classList.add("go"); s.style.setProperty("--dx", "0px"); s.style.setProperty("--dy", "0px");
      },
    });
    s.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); cast(); } });
  });
  await wait(100); stage.classList.add("open"); sfx.paper();
}

async function finish() {
  await wait(350); const wax = $("#wax"); wax.classList.add("glint"); sfx.ding();
  const r = $("#receipt");
  r.innerHTML = `${crest()}<svg class="ok" viewBox="0 0 64 44"><path d="M8 24l16 14L56 6"/></svg><code>${code()}</code><small>Ballot receipt · keep this code</small><div class="stamp">VOTED<small>${E.date}</small></div>`;
  await wait(500); r.classList.add("show"); sfx.paper();
  setTimeout(() => sfx.thud(), 1500);
}
</script>
