<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C3 · Democracy-O-Matic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Monoton&display=swap" rel="stylesheet">
<style>
/* C3 · DEMOCRACY-O-MATIC — a BuildCorp-sponsored arcade cabinet.
   Insert one citizen, mash the glowing buttons, collect your sticker. One tap per act. */
:root { --pink:#ff3fa4; --cyan:#35e6ff; --yel:#ffe14a; --ink:#080a1f; --cab:min(620px,100vw); }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; background:var(--ink); color:#fff; font-family:"VT323", monospace;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
.px { font-family:"Press Start 2P", monospace; }
.arcade { position:fixed; inset:0; overflow:hidden; display:grid; place-items:stretch center; background:
  radial-gradient(circle at 20% 30%, var(--pink) 0 5px, transparent 6px) 0 0 / 150px 130px,
  conic-gradient(from 30deg at 50% 50%, var(--cyan) 0 12%, transparent 0) 40px 70px / 170px 160px,
  linear-gradient(60deg, transparent 46%, var(--yel) 46% 54%, transparent 54%) 90px 20px / 190px 150px, #12143a; }
.arcade::before { content:""; position:absolute; inset:0; background:radial-gradient(70% 70% at 50% 45%, rgba(8,10,31,.5), rgba(8,10,31,.93)); }
.cab { position:relative; width:var(--cab); height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; background:linear-gradient(90deg, #17123a, #2a1f66 12%, #2a1f66 88%, #17123a);
  box-shadow:0 0 0 4px #000, 0 0 60px rgba(255,63,164,.35); }
.cab.rumble { animation:rumble .08s linear infinite alternate; } @keyframes rumble { to { transform:translate(3px,-2px); } }

/* ── marquee ── */
.marq { position:relative; margin:44px 14px 0; padding:12px 8px 9px; text-align:center; border-radius:10px; background:linear-gradient(#fff6c9, #ffd23f); color:#3a0a52;
  box-shadow:0 0 0 4px #000, 0 0 0 8px var(--pink), 0 0 34px rgba(255,210,63,.75); }
.marq h1 { font:400 clamp(21px,5.6vw,38px)/1 "Monoton", cursive; letter-spacing:.02em; color:#d61f8c; text-shadow:2px 2px 0 #3a0a52; }
.marq small { display:block; font-size:16px; letter-spacing:.1em; margin-top:3px; }
.marq::before, .marq::after { content:""; position:absolute; left:6px; right:6px; height:6px; background:radial-gradient(circle, #fff 0 2px, transparent 3px) 0 0 / 16px 6px; animation:chase .4s steps(2) infinite; }
.marq::before { top:2px; } .marq::after { bottom:2px; animation-direction:reverse; } @keyframes chase { to { background-position:16px 0; } }

/* ── CRT ── */
.crt { position:relative; margin:14px 22px 10px; border-radius:26px; background:#0a0f2c; overflow:hidden; box-shadow:0 0 0 6px #050611, 0 0 0 12px #3b3470, inset 0 0 60px rgba(53,230,255,.25); display:grid; }
.crt::before { content:""; position:absolute; inset:0; z-index:3; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px), radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.6)); animation:flick 4s steps(40) infinite; }
@keyframes flick { 50% { opacity:.86; } }
.scr { position:relative; padding:34px 16px 34px; display:grid; align-content:center; justify-items:center; gap:10px; text-align:center; text-shadow:0 0 10px currentColor; min-height:0; }
.hud { position:absolute; left:14px; right:14px; top:10px; display:flex; justify-content:space-between; font:400 9px "Press Start 2P", monospace; color:var(--cyan); z-index:2; }
.scr h2 { font:400 clamp(15px,4vw,25px)/1.3 "Press Start 2P", monospace; color:var(--yel); }
.scr p { font-size:clamp(20px,4.6vw,27px); line-height:1; color:var(--cyan); }
.blink { animation:blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity:0; } }
.picks { display:flex; gap:18px; justify-content:center; min-height:84px; align-items:center; }
.pk { display:grid; justify-items:center; gap:5px; color:var(--c); animation:popin .25s steps(4) both; } @keyframes popin { from { transform:scale(0); } }
.pk .sym { width:54px; height:54px; filter:drop-shadow(0 0 8px currentColor); image-rendering:pixelated; }
.pk b { font:400 10px "Press Start 2P", monospace; color:#fff; }
.q { font:400 46px "Press Start 2P", monospace; color:var(--pink); }
.tick { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:3px 0; background:var(--pink); color:#fff; font-size:19px; white-space:nowrap; overflow:hidden; text-shadow:none; }
.tick span { display:inline-block; padding-left:100%; animation:tick 22s linear infinite; } @keyframes tick { to { transform:translateX(-100%); } }
.bar { width:76%; height:20px; border:3px solid var(--cyan); padding:2px; } .bar i { display:block; height:100%; width:0; background:var(--yel); transition:width 2.2s steps(14); }
.flash { animation:flash .5s steps(4); } @keyframes flash { 50% { background:#fff; } }

/* ── control panel ── */
.panel { position:relative; padding:14px 14px 12px; background:linear-gradient(#3b3470, #211a55); box-shadow:inset 0 5px 0 rgba(255,255,255,.14), 0 -4px 0 #000; }
.domes { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; justify-items:center; }
.cell { display:grid; justify-items:center; gap:11px; width:100%; }
.dome { position:relative; width:clamp(54px,14vw,80px); aspect-ratio:1; border-radius:50%; border:0; cursor:pointer; color:#fff; display:grid; place-items:center;
  background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.75), transparent 30%), radial-gradient(circle, color-mix(in srgb, var(--c) 80%, #fff), var(--c) 58%, color-mix(in srgb, var(--c) 55%, #000));
  box-shadow:0 0 0 4px #111, 0 0 0 7px #6a63a8, 0 7px 0 7px #0b0920; transition:transform .06s, box-shadow .15s, filter .25s; }
.dome .sym { width:46%; height:46%; filter:drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.dome:active, .dome.down { transform:translateY(5px); box-shadow:0 0 0 4px #111, 0 0 0 7px #6a63a8, 0 2px 0 7px #0b0920; }
.dome.lit { filter:brightness(1.3); box-shadow:0 0 0 4px #111, 0 0 0 7px #fff, 0 7px 0 7px #0b0920, 0 0 34px 10px var(--c); }
.dome.off { filter:grayscale(1) brightness(.3); pointer-events:none; }
.dome:focus-visible, .lock:focus-visible, .coin:focus-visible { outline:3px solid #fff; outline-offset:9px; }
.lbl { width:96%; padding:3px 2px; text-align:center; background:#080a1f; color:var(--yel); font-size:clamp(14px,3.3vw,18px); line-height:1; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:inset 0 0 0 1px #6a63a8; min-height:22px; }
.under { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:12px; }
.slot { width:52px; height:66px; border-radius:8px; background:#0b0920; box-shadow:inset 0 0 0 3px #6a63a8; display:grid; place-items:center; gap:2px; align-content:center; font:400 7px "Press Start 2P", monospace; color:var(--yel); }
.slot i { width:8px; height:34px; border-radius:4px; background:#000; box-shadow:0 0 0 2px #ffd23f, 0 0 12px #ffd23f; }
.slot.took i { box-shadow:0 0 0 2px #555; }
.lock { height:62px; padding:0 22px; border:0; border-radius:34px; cursor:pointer; color:#fff; font:400 clamp(11px,2.9vw,14px) "Press Start 2P", monospace; background:linear-gradient(#ff5a5a, #d31b2a 55%, #8e0d18);
  box-shadow:0 0 0 4px #111, 0 7px 0 4px #4a060c; transition:transform .06s, filter .3s; filter:grayscale(.9) brightness(.45); }
.lock.ready { filter:none; animation:throb .7s ease-in-out infinite alternate; } @keyframes throb { to { box-shadow:0 0 0 4px #111, 0 7px 0 4px #4a060c, 0 0 30px 8px rgba(255,90,90,.8); } }
.lock:active { transform:translateY(5px); }
.coin { width:56px; height:56px; border-radius:50%; border:0; cursor:pointer; color:#7a5200; display:grid; place-items:center; background:radial-gradient(circle at 35% 28%, #fff7c2, #ffd23f 55%, #b9860b); box-shadow:0 0 0 3px #b9860b, 0 5px 0 3px #6d4d00; animation:hop .5s ease-in-out infinite alternate; }
.coin .crest { width:50%; } @keyframes hop { to { transform:translateY(-9px) rotate(8deg); } }
.coin.gone { visibility:hidden; }

/* ── tray ── */
.tray { position:relative; height:clamp(84px,14vh,120px); margin:0 22px 12px; border-radius:6px 6px 16px 16px; background:linear-gradient(#000, #0b0920); box-shadow:inset 0 10px 20px #000, 0 0 0 4px #3b3470; overflow:hidden; }
.tray::before { content:"COLLECT"; position:absolute; right:10px; top:6px; font:400 8px "Press Start 2P", monospace; color:#6a63a8; }
.stick { position:absolute; left:58%; bottom:8px; width:clamp(64px,10vh,88px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; text-align:center; color:#2a0a52; font:400 9px/1.5 "Press Start 2P", monospace;
  background:conic-gradient(from 0deg, #ff9de1, #9df3ff, #fff59d, #b6ffb0, #ff9de1); box-shadow:0 0 0 4px #fff, 0 4px 10px #000; transform:translateY(-240%) rotate(-140deg); }
.stick.drop { animation:dropin .7s cubic-bezier(.5,0,.7,1.5) forwards; } @keyframes dropin { to { transform:translateY(0) rotate(-12deg); } }
.rcpt { position:absolute; left:8%; top:0; width:min(200px,46%); padding:8px 8px 10px; background:#f7f5ee; color:#161616; font-size:15px; line-height:1.05; text-align:center; transform:translateY(-102%); transition:transform 1.8s steps(12); }
.rcpt.out { transform:none; }
.rcpt code { display:block; font:400 20px "VT323", monospace; margin:3px 0; padding:2px 0; border-block:1px dashed #161616; }

@media (max-height:680px) { .marq { margin-top:40px; padding:8px 8px 6px; } .marq small { display:none; } .pk .sym { width:40px; height:40px; } .picks { min-height:62px; } }
@media (prefers-reduced-motion:reduce) { * { animation-duration:.01s !important; transition-duration:.01s !important; } }
</style>
</head>
<body>
<main class="arcade">
  <div class="cab" id="cab">
    <header class="marq"><h1>DEMOCRACY-O-MATIC</h1><small>brought to you by BUILDCORP&trade; · your vote matters to our shareholders</small></header>
    <section class="crt" id="crt"><div class="hud"><span id="hl">1 CITIZEN = 1 PLAY</span><span id="hr">CIVIC PTS 000000</span></div>
      <div class="scr" id="scr" role="status"></div>
      <div class="tick"><span>&#9733; BUILDCORP PRICE GLASSES&trade;: KNOW WHAT EVERYTHING IS WORTH &#9733; DEMOCRACY: NOW WITH 40% MORE CHOICE &#9733; NO REFUNDS ON OPINIONS &#9733; WINNERS DON'T ABSTAIN &#9733;</span></div>
    </section>
    <section class="panel">
      <div class="domes" id="domes"></div>
      <div class="under">
        <div class="slot" id="slot"><i></i>1 CIT</div>
        <button class="lock" id="lock" aria-label="Lock in this round">LOCK IT IN</button>
        <button class="coin" id="coin" aria-label="Insert yourself: one citizen token"></button>
      </div>
    </section>
    <section class="tray"><div class="rcpt" id="rcpt" role="status"></div><div class="stick" id="stick">I<br>VOTED</div></section>
  </div>
</main>

<script src="shared.js"></script>
<script>
const { $, $$, wait, election: E, sym, crest, sfx, centre, choose, code, chrome } = EP;
chrome({ code: "C3", name: "Democracy-O-Matic" });

const scr = $("#scr"), domes = $("#domes"), lock = $("#lock"), coin = $("#coin"), cab = $("#cab");
const sel = {}; let idx = -1, busy = false, pts = 0;
coin.innerHTML = crest();
domes.innerHTML = [0, 1, 2, 3].map(() => `<div class="cell"><button class="dome off" aria-label="Unused button"></button><div class="lbl"></div></div>`).join("");
const beep = (f, d = 0.09, at = 0) => sfx.tone(f, d, { type: "square", vol: 0.06, at });
const jingle = (ns) => ns.forEach((f, i) => beep(f, 0.11, i * 0.1));
const score = (n) => { pts += n; $("#hr").textContent = "CIVIC PTS " + String(pts).padStart(6, "0"); };

scr.innerHTML = `<h2 class="blink">INSERT<br>CITIZEN</h2><p>tap the token &#9658;</p>`;

coin.onclick = async () => {
  if (idx >= 0) return;
  const a = centre(coin), b = centre($("#slot i"));
  coin.style.animation = "none";
  await coin.animate([{ transform: "none" }, { transform: `translate(${(b.x - a.x) / 2}px,${b.y - a.y - 70}px) rotateY(540deg)`, offset: 0.55 }, { transform: `translate(${b.x - a.x}px,${b.y - a.y}px) rotateY(1080deg) scale(.3)` }], { duration: 650, easing: "ease-in" }).finished;
  coin.classList.add("gone"); $("#slot").classList.add("took"); sfx.coin();
  scr.innerHTML = `<h2>CITIZEN<br>ACCEPTED</h2><p>CREDIT: 3 OPINIONS</p>`; $("#hl").textContent = "CREDIT 3"; jingle([523, 659, 784, 1047]);
  await wait(1500); round();
};

function round() {
  idx++; const p = E.points[idx]; sel[p.id] = [];
  $("#hl").textContent = `ROUND ${p.no}/3`;
  $$(".cell", domes).forEach((c, i) => {
    const o = p.options[i], d = $(".dome", c);
    d.className = "dome" + (o ? "" : " off"); d.style.setProperty("--c", o ? o.color : "#444"); d.innerHTML = o ? sym(o.sym) : "";
    d.setAttribute("aria-label", o ? o.full : "Unused button"); d.setAttribute("aria-pressed", "false"); $(".lbl", c).textContent = o ? o.name.toUpperCase() : "";
    d.onclick = o ? () => press(p, o, d) : null;
  });
  paint(p); beep(880); beep(1320, 0.09, 0.1);
}
function paint(p) {
  const cur = sel[p.id];
  scr.innerHTML = `<h2>${p.title.toUpperCase()}</h2><p>${p.kind === "yesno" ? p.ask.toUpperCase() : p.max > 1 ? "PICK 2 FOR A COMBO" : "PICK 1"}</p>
    <div class="picks">${cur.length ? cur.map((id) => { const o = p.options.find((x) => x.id === id); return `<div class="pk" style="--c:${o.color}">${sym(o.sym)}<b>${o.name.toUpperCase()}</b></div>`; }).join("") : `<span class="q blink">?</span>`}</div>
    <p class="${cur.length ? "blink" : ""}">${cur.length ? "&#9660; LOCK IT IN &#9660;" : "MASH A BUTTON"}</p>`;
  $$(".dome", domes).forEach((d, i) => { const on = p.options[i] && cur.includes(p.options[i].id); d.classList.toggle("lit", !!on); d.setAttribute("aria-pressed", !!on); });
  lock.classList.toggle("ready", cur.length > 0);
}
function press(p, o, d) {
  if (busy) return;
  d.classList.add("down"); setTimeout(() => d.classList.remove("down"), 110);
  const r = choose(sel, p, o.id);
  if (r.full) { sfx.buzz(); $("#crt").classList.remove("flash"); scr.querySelector("p").textContent = "GREEDY. " + p.max + " MAX."; return; }
  sfx.click(); beep(r.on ? 990 : 440); paint(p);
}

lock.onclick = async () => {
  const p = E.points[idx]; if (busy || !p || !sel[p.id].length) return; busy = true;
  lock.classList.remove("ready"); sfx.thud(); jingle([659, 784, 988, 1319]);
  const combo = sel[p.id].length > 1;
  scr.innerHTML = `<h2 class="blink">${combo ? "COMBO x2!" : "LOCKED IN!"}</h2><p>+${combo ? 250 : 100} CIVIC POINTS</p>`; score(combo ? 250 : 100);
  $("#crt").classList.remove("flash"); void $("#crt").offsetWidth; $("#crt").classList.add("flash");
  await wait(1300); busy = false;
  if (idx < E.points.length - 1) round(); else payout();
};

async function payout() {
  busy = true; $$(".dome", domes).forEach((d) => (d.className = "dome off")); $("#hl").textContent = "CREDIT 0";
  scr.innerHTML = `<h2>COUNTING YOUR<br>FEELINGS</h2><div class="bar"><i></i></div><p>DO NOT KICK THE MACHINE</p>`;
  await wait(60); scr.querySelector(".bar i").style.width = "100%"; cab.classList.add("rumble"); sfx.ratchet(22, 0.1);
  await wait(2300); cab.classList.remove("rumble"); sfx.thud();
  $("#stick").classList.add("drop"); setTimeout(() => sfx.clunk(), 450);
  const r = $("#rcpt"); r.innerHTML = `BUILDCORP THANKS YOU<code>${code()}</code>KEEP THIS. PROVES YOU PLAYED.`;
  r.classList.add("out"); sfx.ratchet(12, 0.14);
  scr.innerHTML = `<h2>THANK YOU,<br>CITIZEN</h2><p>TAKE YOUR STICKER &#9660;</p><p class="blink">GAME OVER. INSERT NEXT CITIZEN</p>`; sfx.fanfare(); score(1000);
}
</script>
</body>
</html>
