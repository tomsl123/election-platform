<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B3 · The Marble Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* B3 · THE MARBLE POLL — painted drums in a sunlit yard, one glass marble per choice.
   No reading needed: colour, symbol, a marble, a bell. Then an inked finger. */
:root { --plaster:#dd9450; --ground:#cfae74; --paint:#fff6e3; --dark:#2a1a10; }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; background:#b9783a; color:var(--dark); font-family:"Patrick Hand", "Comic Sans MS", cursive;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
.sign { font-family:"Bowlby One", Impact, sans-serif; text-transform:uppercase; letter-spacing:.03em; }
.yard { position:fixed; inset:0; overflow:hidden; display:grid; grid-template-rows:auto 1fr auto; justify-items:center; background:
  radial-gradient(60% 40% at 78% 0%, rgba(255,240,190,.55), transparent 70%),
  repeating-linear-gradient(93deg, rgba(120,60,10,.05) 0 3px, transparent 3px 17px),
  linear-gradient(var(--plaster) 0 58%, #a8662c 58% 59.2%, var(--ground) 59.2%); }
.yard::after { content:""; position:absolute; left:0; right:0; top:59.2%; bottom:0; pointer-events:none; background:radial-gradient(80% 60% at 50% 0%, rgba(90,50,10,.28), transparent 70%), repeating-linear-gradient(2deg, rgba(90,50,10,.06) 0 2px, transparent 2px 9px); }
.motto { position:absolute; left:3%; top:26%; max-width:150px; color:rgba(255,246,227,.82); font-size:19px; line-height:1.02; transform:rotate(-4deg); z-index:1; }
.motto small { display:block; font:400 17px "Patrick Hand", cursive; text-transform:none; letter-spacing:0; margin-top:5px; }

/* ── hanging board ── */
.board { position:relative; z-index:3; margin-top:46px; padding:9px 22px 10px; min-width:min(330px,84vw); text-align:center; color:var(--paint); border-radius:5px;
  background:repeating-linear-gradient(1deg, rgba(0,0,0,.1) 0 2px, transparent 2px 12px), linear-gradient(#3b5b6b, #2c4756); box-shadow:0 8px 14px rgba(60,25,0,.4); transform-origin:50% -40px; animation:sway 5s ease-in-out infinite; transition:transform .35s; }
.board::before, .board::after { content:""; position:absolute; top:-46px; width:3px; height:46px; background:#6b4a2b; } .board::before { left:18%; } .board::after { right:18%; }
@keyframes sway { 50% { rotate:1.2deg; } }
.board.flip { transform:rotateX(90deg); }
.board h2 { font:400 clamp(21px,5vw,29px)/1.05 "Bowlby One", sans-serif; text-transform:uppercase; }
.board p { font-size:18px; line-height:1.1; margin-top:2px; }
.dots { display:inline-flex; gap:5px; vertical-align:middle; margin-left:6px; } .dots i { width:13px; height:13px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--m) 60%); }

/* ── drums ── */
.row { position:relative; z-index:2; align-self:end; display:grid; grid-template-columns:repeat(var(--cols,4), minmax(0,150px)); gap:clamp(10px,2.4vw,26px); justify-content:center; width:100%; padding:0 14px 10px; transition:transform .5s cubic-bezier(.6,0,.3,1), opacity .4s; }
.row.out { transform:translateX(-110vw); opacity:0; } .row.pre { transform:translateX(110vw); opacity:0; transition:none; }
.drum { position:relative; border:0; padding:0; background:none; cursor:pointer; font:inherit; color:var(--paint); aspect-ratio:1/1.22; display:flex; flex-direction:column; outline-offset:6px; }
.drum:focus-visible, .marble:focus-visible, .pot:focus-visible { outline:4px solid #fff; }
.lid { position:relative; z-index:2; height:19%; margin-bottom:-9.5%; border-radius:50%; background:radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--c) 78%, #fff), color-mix(in srgb, var(--c) 62%, #000)); box-shadow:0 2px 0 rgba(0,0,0,.35); }
.pipe { position:absolute; left:50%; top:50%; width:32%; height:52%; transform:translate(-50%,-50%); border-radius:50%; background:#110803; box-shadow:0 0 0 3px #3a2a1c, 0 2px 0 3px rgba(255,255,255,.25); }
.body { flex:1; border-radius:0 0 12% 12% / 0 0 8% 8%; display:grid; place-items:center; align-content:center; gap:4%; padding-top:9%; background:
  linear-gradient(transparent 30%, rgba(0,0,0,.28) 30% 32%, rgba(255,255,255,.22) 32% 33.5%, transparent 33.5% 70%, rgba(0,0,0,.28) 70% 72%, rgba(255,255,255,.22) 72% 73.5%, transparent 73.5%),
  linear-gradient(90deg, color-mix(in srgb, var(--c) 52%, #000), var(--c) 22%, color-mix(in srgb, var(--c) 72%, #fff) 46%, var(--c) 72%, color-mix(in srgb, var(--c) 48%, #000));
  box-shadow:0 14px 12px -6px rgba(60,25,0,.5); }
.disc { width:44%; aspect-ratio:1; border-radius:50%; background:var(--paint); display:grid; place-items:center; color:var(--c); box-shadow:inset 0 0 0 3px rgba(0,0,0,.08); }
.disc .sym { width:66%; height:66%; }
.drum { container-type:inline-size; }
.drum b { font:400 8.4cqw/1 "Bowlby One", sans-serif; text-transform:uppercase; text-shadow:0 2px 0 rgba(0,0,0,.35); }
.drum small { font-size:15px; line-height:1; opacity:.9; margin-top:-3%; }
.drum.rattle { animation:rattle .5s; } @keyframes rattle { 15% { rotate:-2.5deg; } 35% { rotate:2.2deg; } 55% { rotate:-1.4deg; } 75% { rotate:.8deg; } }
.ringl { position:absolute; left:50%; top:4%; width:40%; aspect-ratio:1; margin-left:-20%; border-radius:50%; border:3px solid var(--paint); opacity:0; pointer-events:none; z-index:4; }
.drum.ding .ringl { animation:ding .9s ease-out; } .drum.ding .ringl + .ringl { animation-delay:.18s; }
@keyframes ding { from { opacity:.9; transform:scale(.4); } to { opacity:0; transform:scale(2.6); } }
.drum.armed .lid::after { content:""; position:absolute; left:50%; top:-150%; width:0; height:0; margin-left:-9px; border:9px solid transparent; border-top:13px solid var(--paint); animation:bob .7s ease-in-out infinite; }
@keyframes bob { 50% { translate:0 6px; } }

/* ── tray and marbles ── */
.tray { position:relative; z-index:3; margin:8px 0 max(18px,3vh); width:min(250px,64vw); height:74px; border-radius:16px 16px 40px 40px; background:linear-gradient(#7a5230, #5a3a1f); box-shadow:inset 0 8px 14px rgba(0,0,0,.55), 0 8px 12px rgba(60,25,0,.4); display:flex; align-items:center; justify-content:center; gap:16px; }
.marble { width:48px; height:48px; border-radius:50%; border:0; padding:0; cursor:grab; touch-action:none; position:relative; z-index:6;
  background:radial-gradient(circle at 32% 28%, #fff 0 9%, transparent 22%), conic-gradient(from 40deg, var(--m), #fff 18%, var(--m) 36%, color-mix(in srgb, var(--m) 55%, #000) 60%, var(--m) 82%, #fff 92%, var(--m));
  box-shadow:inset -5px -7px 10px rgba(0,0,0,.35), inset 4px 5px 8px rgba(255,255,255,.55), 0 6px 7px rgba(0,0,0,.45); transform:translate(var(--dx,0px), var(--dy,0px)); }
.marble.fly { transition:transform .38s cubic-bezier(.3,.7,.3,1); }
.marble.armed { animation:hover .7s ease-in-out infinite; } @keyframes hover { 50% { translate:0 -7px; } }
.marble.sink { transition:transform .32s cubic-bezier(.6,0,.9,.5), opacity .1s .26s; opacity:0; }

/* ── indelible ink ── */
.inkroom { position:absolute; inset:0; z-index:5; display:none; place-items:center; }
.inkroom.on { display:grid; }
.station { position:relative; width:220px; height:min(430px,62vh); }
.pot { position:absolute; left:50%; top:0; width:130px; height:104px; margin-left:-65px; border:0; background:none; cursor:pointer; padding:0; }
.potb, .potf { position:absolute; left:0; right:0; }
.potb { top:0; height:38px; border-radius:50%; background:radial-gradient(ellipse at 50% 60%, #6a2bb8, #3b0f73 75%); box-shadow:0 0 0 6px #d7d0c2, 0 0 0 8px #9b9486; }
.potf { top:18px; bottom:0; z-index:3; border-radius:0 0 26px 26px; background:linear-gradient(90deg, #a9a294, #f1ecdf 40%, #d7d0c2 70%, #9b9486); display:grid; place-items:center; color:#4a1791; font:400 14px "Bowlby One", sans-serif; letter-spacing:.1em; clip-path:polygon(0 0,6% 10%,50% 17%,94% 10%,100% 0,100% 100%,0 100%); pointer-events:none; }
.pot.hint .potb { animation:glowp 1.2s ease-in-out infinite; } @keyframes glowp { 50% { box-shadow:0 0 0 6px #d7d0c2, 0 0 0 8px #9b9486, 0 0 26px 8px rgba(160,90,255,.75); } }
.hand { position:absolute; left:50%; bottom:-40px; width:150px; margin-left:-71px; z-index:2; touch-action:none; cursor:grab; transform:translateY(var(--hy,0px)); }
.hand.move { transition:transform .5s cubic-bezier(.5,0,.3,1); }
.hand .tip { opacity:0; transition:opacity .25s; } .hand.inked .tip { opacity:1; }
.drop { position:absolute; left:50%; top:120px; width:9px; height:12px; margin-left:-4px; border-radius:50% 50% 50% 50% / 30% 30% 70% 70%; background:#5a1fa6; opacity:0; z-index:1; }
.drop.fall { animation:fall .7s ease-in forwards; } @keyframes fall { from { opacity:1; } to { opacity:0; transform:translateY(120px); } }

/* ── receipt ── */
.card { position:absolute; left:50%; top:50%; width:min(320px,84vw); padding:22px 20px 18px; z-index:9; text-align:center; background:var(--paint); border-radius:6px; box-shadow:0 22px 34px rgba(60,25,0,.5);
  transform:translate(-50%,120vh) rotate(6deg); transition:transform .8s cubic-bezier(.2,.8,.2,1); }
.card.show { transform:translate(-50%,-50%) rotate(-3deg); }
.print { width:92px; height:118px; margin:0 auto 8px; border-radius:48% 48% 46% 46% / 42% 42% 58% 58%; background:repeating-radial-gradient(ellipse at 50% 62%, #5a1fa6 0 2.2px, transparent 2.2px 5.6px); opacity:.85; transform:rotate(-8deg); -webkit-mask:radial-gradient(ellipse at 50% 50%, #000 55%, transparent 72%); mask:radial-gradient(ellipse at 50% 50%, #000 55%, transparent 72%); }
.card h3 { font:400 23px "Bowlby One", sans-serif; text-transform:uppercase; color:#4a1791; }
.card code { display:block; font:400 21px "Bowlby One", sans-serif; letter-spacing:.06em; margin:8px 0; padding:9px 0; border-block:3px dotted var(--dark); }
.card p { font-size:18px; line-height:1.15; }

@media (orientation:portrait) { .motto { display:none; } .drum small { font-size:13px; } .row { gap:14px 22px; } }
@media (max-height:640px) and (orientation:landscape) { .row { grid-template-columns:repeat(var(--cols,4), minmax(0,118px)); } .board { margin-top:40px; } }
@media (prefers-reduced-motion:reduce) { * { animation-duration:.01s !important; transition-duration:.01s !important; } }
</style>
</head>
<body>
<main class="yard" id="yard">
  <div class="motto sign" id="motto">One ding per citizen<small>the officer is listening.</small></div>
  <div class="board" id="board" role="status"></div>
  <div class="row" id="row"></div>
  <div class="tray" id="tray"></div>
  <div class="inkroom" id="inkroom">
    <div class="station">
      <button class="pot hint" id="pot" aria-label="Dip your finger in the indelible ink"><span class="potb"></span><span class="potf">INK</span></button>
      <i class="drop" id="drop"></i>
      <svg class="hand" id="hand" viewBox="0 0 150 300" aria-hidden="true">
        <rect x="56" y="4" width="34" height="150" rx="17" fill="#f0c38e"/><rect class="tip" x="56" y="4" width="34" height="52" rx="17" fill="#5a1fa6"/>
        <rect x="18" y="128" width="34" height="78" rx="17" fill="#e2b079" transform="rotate(-24 35 170)"/>
        <rect x="40" y="118" width="96" height="120" rx="30" fill="#f0c38e"/>
        <rect x="88" y="104" width="24" height="52" rx="12" fill="#e2b079"/><rect x="111" y="112" width="23" height="48" rx="11.5" fill="#e2b079"/>
        <rect x="46" y="222" width="86" height="80" fill="#2c4756"/><rect x="42" y="214" width="94" height="18" rx="6" fill="#fff6e3"/>
      </svg>
    </div>
  </div>
  <div class="card" id="card" role="status"></div>
</main>

<script src="shared.js"></script>
<script>
const { $, $$, wait, election: E, sym, sfx, drag, over, centre, code, chrome } = EP;
chrome({ code: "B3", name: "The Marble Poll" });

const board = $("#board"), row = $("#row"), tray = $("#tray");
const MAR = ["#2f6fd6", "#2fa86a", "#e39a1c"];
let idx = 0, busy = false, armed = null;

function room() {
  const p = E.points[idx], n = p.options.length;
  const portrait = matchMedia("(orientation:portrait)").matches;
  row.style.setProperty("--cols", portrait && n > 2 ? 2 : n);
  board.innerHTML = `<h2 class="sign">${p.no} · ${p.title}</h2><p>${p.kind === "yesno" ? p.ask : p.max > 1 ? "two marbles, two drums" : "one marble, one drum"}<span class="dots" style="--m:${MAR[idx]}">${"<i></i>".repeat(p.max)}</span></p>`;
  row.innerHTML = p.options.map((o) => `<button class="drum" data-id="${o.id}" style="--c:${o.color}" aria-label="${o.full}">
    <span class="lid"><i class="pipe"></i></span><span class="body"><span class="disc">${sym(o.sym)}</span><b>${o.name}</b>${o.party ? `<small>${o.party}</small>` : ""}</span><i class="ringl"></i><i class="ringl"></i></button>`).join("");
  tray.innerHTML = Array.from({ length: p.max }, (_, i) => `<button class="marble" style="--m:${MAR[idx]}" aria-label="Marble ${i + 1}"></button>`).join("");
  const used = new Set();
  const free = () => $$(".marble", tray).find((m) => !m.dataset.gone);
  const home = (m) => { m.classList.add("fly"); m.classList.remove("armed"); m.style.setProperty("--dx", "0px"); m.style.setProperty("--dy", "0px"); };
  const disarm = () => { if (!armed) return; armed.drum.classList.remove("armed"); home(armed.m); armed = null; };
  const shift = (m, x, y) => { const r = m.getBoundingClientRect(); const dx = parseFloat(m.style.getPropertyValue("--dx") || 0), dy = parseFloat(m.style.getPropertyValue("--dy") || 0); m.style.setProperty("--dx", dx + x - (r.left + r.width / 2) + "px"); m.style.setProperty("--dy", dy + y - (r.top + r.height / 2) + "px"); };

  async function drop(m, drum) {
    if (used.has(drum.dataset.id)) { sfx.buzz(); home(m); return; }   /* one marble per drum */
    busy = true; armed = null; drum.classList.remove("armed"); m.dataset.gone = 1; used.add(drum.dataset.id);
    const c = centre($(".pipe", drum));
    m.classList.remove("armed"); m.classList.add("fly"); shift(m, c.x, c.y - 34); await wait(390);
    m.classList.replace("fly", "sink"); shift(m, c.x, c.y + 6); m.style.transform += " scale(.55)"; sfx.pop();
    await wait(330); sfx.ratchet(5, 0.07); drum.classList.remove("rattle"); void drum.offsetWidth; drum.classList.add("rattle");
    await wait(420); sfx.bell(); drum.classList.remove("ding"); void drum.offsetWidth; drum.classList.add("ding");
    busy = false;
    if (!free()) { await wait(1100); next(); }
  }
  function arm(drum) {
    if (busy) return;
    if (armed && armed.drum === drum) return drop(armed.m, drum);
    const m = armed ? armed.m : free(); if (!m) return;
    if (armed) armed.drum.classList.remove("armed");
    if (used.has(drum.dataset.id)) { sfx.buzz(); return; }
    const c = centre($(".pipe", drum)); m.classList.add("fly"); m.classList.remove("armed"); shift(m, c.x, c.y - 44);
    armed = { m, drum }; drum.classList.add("armed"); sfx.tick(); setTimeout(() => armed && armed.m === m && m.classList.add("armed"), 400);
  }
  $$(".drum", row).forEach((d) => (d.onclick = () => arm(d)));
  $$(".marble", tray).forEach((m) => {
    drag(m, {
      when: () => !busy && !m.dataset.gone,
      start: () => { if (armed && armed.m === m) { armed.drum.classList.remove("armed"); armed = null; } m.classList.remove("fly", "armed"); },
      move: (dx, dy, e) => shift(m, e.clientX, e.clientY),
      end: (dx, dy, e, moved) => {
        const d = $$(".drum", row).find((d) => over(d, e.clientX, e.clientY, 8));
        if (moved && d) return drop(m, d);
        home(m); if (!moved) sfx.tick();
      },
    });
  });
  tray.onclick = (e) => { if (e.target === tray) disarm(); };
}

async function next() {
  idx++; sfx.paper();
  row.classList.add("out"); board.classList.add("flip"); await wait(380);
  if (idx >= E.points.length) return inkRoom();
  row.classList.remove("out"); row.classList.add("pre"); room(); board.classList.remove("flip");
  void row.offsetWidth; row.classList.remove("pre");
}

/* ── the inked finger: the proof you have voted ── */
async function inkRoom() {
  row.style.display = "none"; tray.style.visibility = "hidden";
  board.innerHTML = `<h2 class="sign">Ink your finger</h2><p>it does not wash off. Neither does your choice.</p>`; board.classList.remove("flip");
  $("#motto").innerHTML = `One finger per citizen<small>we counted.</small>`;
  $("#inkroom").classList.add("on");
  const hand = $("#hand"), pot = $("#pot"); let done = false, y0 = 0;
  const reach = () => hand.getBoundingClientRect().top - (pot.getBoundingClientRect().top + 30) - parseFloat(hand.style.getPropertyValue("--hy") || 0) * 0;
  async function dip(auto) {
    if (done) return; done = true; pot.classList.remove("hint");
    if (auto) { hand.classList.add("move"); hand.style.setProperty("--hy", -(hand.getBoundingClientRect().top - pot.getBoundingClientRect().top - 26) + "px"); await wait(520); }
    sfx.pop(); hand.classList.add("inked"); await wait(350);
    hand.classList.add("move"); hand.style.setProperty("--hy", "0px"); $("#drop").classList.add("fall"); await wait(700); sfx.tick();
    const card = $("#card");
    card.innerHTML = `<div class="print"></div><h3>Inked. Voted.</h3><code>${code()}</code><p>Three dings were heard and written down.<br>Keep this number to check yours.</p>`;
    await wait(300); card.classList.add("show"); sfx.paper(); sfx.ding();
  }
  pot.onclick = () => dip(true);
  drag(hand, {
    when: () => !done,
    start: () => { hand.classList.remove("move"); y0 = hand.getBoundingClientRect().top - pot.getBoundingClientRect().top - 26; },
    move: (dx, dy) => { const y = Math.max(-y0, Math.min(40, dy)); hand.style.setProperty("--hy", y + "px"); if (y <= -y0 + 6) dip(false); },
    end: () => { if (!done) { hand.classList.add("move"); hand.style.setProperty("--hy", "0px"); } },
  });
}

room();
</script>
</body>
</html>
